name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the app
        run: npm run build
      - name: Wait for legacy branch Pages build to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            ACTIVE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" or .name == "pages build and deployment") | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            if [ "${ACTIVE:-0}" -eq 0 ]; then
              break
            fi
            echo "Waiting for legacy pages-build-deployment to finish (${ACTIVE} active)..."
            sleep 5
          done
          sleep 3
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Ensure legacy branch Pages build has completed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            ACTIVE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" or .name == "pages build and deployment") | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            if [ "${ACTIVE:-0}" -eq 0 ]; then
              break
            fi
            echo "Waiting for legacy pages-build-deployment to finish (${ACTIVE} active)..."
            sleep 5
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
