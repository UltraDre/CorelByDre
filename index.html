<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>CorelByDre — Vector Illustration, Layout &amp; Photo Studio</title>
    <meta name="description" content="Professional vector illustration, page layout and photo editing in your browser. Offline-first PWA." />
    <meta name="theme-color" content="#101418" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CorelByDre" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      Server push (collaboration invites, comment mentions, export completion)
      needs a VAPID public key. Paste the deployment's key below to enable it;
      left empty, the app stays on in-page notifications and never attempts a
      subscription. See src/lib/collab.ts → vapidPublicKey().
    -->
    <meta name="corelbydre-vapid-key" content="" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
